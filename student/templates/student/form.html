<!DOCTYPE html>
<html>
<head>
<title>Student Registration</title>
<style>
body { font-family: 'Segoe UI', Arial; background: #f5f7fb; margin:0; padding:20px; }
.card { max-width:600px; margin:30px auto; background:white; padding:30px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
h2 { text-align:center; color:#2c3e50; margin-top:0; }
label { font-weight:600; display:block; margin-top:15px; color:#34495e; }
input[type=text], input[type=number], select, textarea { width:100%; padding:10px; margin-top:6px; border:1px solid #dcdfe6; border-radius:8px; box-sizing:border-box; }
.radio-group, .check-group { margin-top:6px; }
.radio-group label, .check-group label { font-weight:normal; display:inline; margin-left:6px; }
.option { margin:6px 0; }
button { width:100%; margin-top:25px; padding:12px; background:#4a6cf7; color:white; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; }
button:hover { background:#3a5ae8; }
.errors { background:#ffeaea; color:#d63031; padding:12px; border-radius:8px; margin-bottom:15px; }
</style>
</head>
<body>
<div class="card">
<h2>Student Information Form</h2>
{% if errors %}<div class="errors"><ul style="margin:0; padding-left:20px;">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form method="POST">
{% csrf_token %}
<label>Student Name:</label>
<input type="text" name="student_name" value="{{ data.student_name }}" placeholder="e.g. Jane Doe">

<label>Student ID:</label>
<input type="text" name="student_id" value="{{ data.student_id }}" placeholder="e.g. 123456">

<label>Major:</label>
<select name="major">
{% for m in majors %}<option {% if data.major == m %}selected{% endif %}>{{ m }}</option>{% endfor %}
</select>

<label>Class Standing:</label>
<div class="radio-group">
{% for s in standings %}<div class="option"><input type="radio" name="standing" value="{{ s }}" id="s{{ forloop.counter }}"><label for="s{{ forloop.counter }}">{{ s }}</label></div>{% endfor %}
</div>

<label>Programming Languages Known:</label>
<div class="check-group">
{% for lang in languages %}<div class="option"><input type="checkbox" name="languages" value="{{ lang }}" id="l{{ forloop.counter }}"><label for="l{{ forloop.counter }}">{{ lang }}</label></div>{% endfor %}
</div>

<label>Expected Graduation Year:</label>
<input type="number" name="grad_year" placeholder="e.g. 2026">

<label>Comments:</label>
<textarea name="comments" rows="4" placeholder="Any additional info..."></textarea>

<button type="submit">Submit Registration</button>
</form>
</div>
</body>
</html>
